<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mock Flight Aggregator</title>
</head>
<body>
    <h1>Flight Search Results</h1>
    <div class="results-container">
        
        <!-- Flight 1 -->
        <div class="flight-card">
            <h2 class="airline">Swiss International Air Lines</h2>
            <div class="route">
                <span class="origin">DEL</span> &rarr; <span class="destination">ZRH</span>
            </div>
            <div class="details">
                <span class="class">Business</span>
            </div>
            <div class="price-container">
                <span class="currency">₹</span><span class="price">1,45,000</span>
            </div>
        </div>

        <!-- Flight 2 -->
        <div class="flight-card">
            <h2 class="airline">ITA Airways</h2>
            <div class="route">
                <span class="origin">DEL</span> &rarr; <span class="destination">FCO</span>
            </div>
            <div class="details">
                <span class="class">First Class</span>
            </div>
            <div class="price-container">
                <span class="currency">₹</span><span class="price">2,10,000</span>
            </div>
        </div>

        <!-- Flight 3 -->
        <div class="flight-card">
            <h2 class="airline">Finnair</h2>
            <div class="route">
                <span class="origin">DEL</span> &rarr; <span class="destination">CPH</span>
            </div>
            <div class="details">
                <span class="class">Economy</span>
            </div>
            <div class="price-container">
                <span class="currency">₹</span><span class="price">52,000</span>
            </div>
        </div>

    </div>
</body>
</html>
